[project]
name = "echovault"
version = "0.7.0.dev0"
description = "Local-first audio workspace for media, lyrics, editing, transfer, and AI automation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "xiaohaifale" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
cache_dir = ".test-temp/pytest-cache"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E701", "E702"]
